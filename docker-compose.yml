services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inscriptions
      POSTGRES_PASSWORD: inscriptions
      POSTGRES_DB: inscriptions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inscriptions -d inscriptions"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://inscriptions:inscriptions@db:5432/inscriptions
      UPLOAD_DIR: /data/uploads
      SECRET_KEY: change-me-in-production
      SEED: "1"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
